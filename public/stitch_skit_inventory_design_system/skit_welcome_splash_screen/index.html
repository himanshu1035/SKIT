<img alt="Smart Pantry Shelf Scanning Display" class="w-full h-full object-contain filter drop-shadow-sm select-none pointer-events-none" src="https://lh3.googleusercontent.com/aida/ALJJyrAvEAgjCcWV4-WuT3FlHJLJEZ3mJm4bj3k3hRZnkz3_PcmFGGLdQFKcSmIjgWLTIMEih9Pwegh6IHmZv2CTQqpI3IFz5sPVkSzeifK4nrOmRckb3yHJzBRjID769ZTW8B0bd0_3KZi5IhIIHk9gEZDhALvP0M9O7EtWKpoJh7xrsvjM3LRun_H3hns4EATC8cBRIKPaXUPUdBS5Ut-zrtSoa4OxpK7Uyr1Y4hzvmDoY">
</div>
</div>
<!-- Branding & Mission Hierarchy -->
<div class="flex flex-col items-center text-center mt-2 px-2">
<!-- Brand Tag & Version Leaf -->

<div class="flex items-center justify-center gap-2">
<h1 class="font-display-lg text-display-lg-mobile text-primary tracking-tight font-extrabold">SKIT</h1>

</div>
<!-- Expanded Name & Value Proposition -->
<h2 class="font-headline-title text-headline-title text-on-surface font-semibold mt-1">
      Smart Kariyana Inventory Technology
    </h2>
<p class="font-body-default text-body-default text-on-surface-variant max-w-[290px] mt-2 leading-relaxed">Smart inventory &amp; expiry tracking for your store.</p>
<!-- Operational Benefit Micro-Pills -->

</div>
<!-- Action Deck & Onboarding Pathways -->
<div class="flex flex-col w-full mt-8 gap-3">
<!-- Primary CTA Button with Touch Feedback -->
<button class="group w-full h-14 bg-primary text-on-primary rounded-xl flex items-center justify-center gap-2 font-headline-title text-headline-title font-semibold shadow-md active:scale-[0.98] transition-all duration-200" id="getStartedBtn">
<span>Get Started</span>
<span class="material-symbols-outlined text-[20px] transition-transform duration-200 group-hover:translate-x-1">arrow_forward</span>
</button>
<!-- Secondary Account Action -->
<button class="w-full h-12 flex items-center justify-center gap-1 rounded-xl text-on-surface-variant font-body-medium text-body-medium active:bg-surface-container-low transition-colors duration-150" id="loginRedirectBtn">
<span>Already have an account?</span>
<span class="text-primary font-semibold underline underline-offset-4 decoration-primary/40">Log In</span>
</button>
</div>
<!-- Live Warehouse Network Status Ping -->

</div>
<script>
  (function() {
    const btn = document.getElementById('getStartedBtn');
    if (btn) {
      btn.addEventListener('click', function(e) {
        // Subtle ripple micro-interaction
        const rect = btn.getBoundingClientRect();
        const ripple = document.createElement('span');
        ripple.className = 'absolute bg-white/20 rounded-full pointer-events-none transform -translate-x-1/2 -translate-y-1/2 animate-ping';
        ripple.style.width = ripple.style.height = Math.max(rect.width, rect.height) + 'px';
        ripple.style.left = (e.clientX - rect.left) + 'px';
        ripple.style.top = (e.clientY - rect.top) + 'px';
        btn.appendChild(ripple);
        setTimeout(() => ripple.remove(), 600);
      });
    }
  })();
</script></main><footer class="fixed bottom-0 inset-x-0 z-50 pb-safe pointer-events-none bg-surface/80 backdrop-blur-xl"><div class="h-6 flex items-center justify-center"><div class="w-28 h-1 rounded-full bg-on-surface-variant/40"></div></div></footer>
