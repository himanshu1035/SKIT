<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#F6F8F7" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Sign Up - JAAT Store</title>
  <link rel="manifest" href="../manifest.json" />
  <link rel="apple-touch-icon" href="../icons/icon.svg" />
  <link rel="stylesheet" href="../css/theme.css" />
</head>
<body>

  <div class="mobile-box">
    <a href="../index.html" class="back-link">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
      <span>Back</span>
    </a>

    <div class="auth-card">
      <h2>Sign Up</h2>
      <p id="signup-main-error" class="main-error"></p>

      <form id="signup-form" onsubmit="handleSignup(event)">
        <div class="field">
          <label for="signup-mobile">Mobile Number</label>
          <input type="tel" id="signup-mobile" placeholder="10-digit mobile number" maxlength="10" />
          <div id="signup-mobile-error" class="error"></div>
        </div>

        <div class="field">
          <label for="signup-shop">Shop Name</label>
          <input type="text" id="signup-shop" placeholder="Enter shop name" />
          <div id="signup-shop-error" class="error"></div>
        </div>

        <div class="field">
          <label for="signup-password">Password</label>
          <div class="password-box">
            <input type="password" id="signup-password" placeholder="Minimum 6 characters" />
            <button type="button" class="show-btn" aria-label="Toggle password visibility" onclick="togglePassword('signup-password', this)">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <div id="signup-password-error" class="error"></div>
        </div>

        <div class="field">
          <label for="signup-confirm">Confirm Password</label>
          <div class="password-box">
            <input type="password" id="signup-confirm" placeholder="Re-enter password" />
            <button type="button" class="show-btn" aria-label="Toggle password visibility" onclick="togglePassword('signup-confirm', this)">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <div id="signup-confirm-error" class="error"></div>
        </div>

        <button type="submit" class="btn btn-blue">Sign Up</button>
      </form>
    </div>

    <p class="bottom-text">
      Already have an account? <a href="login.html">Login</a>
    </p>
  </div>

  <script src="../js/supabase.min.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
