<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#fafafa" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Inventory - SKIT Shop</title>
  <link rel="manifest" href="../manifest.json" />
  <link rel="apple-touch-icon" href="../icons/icon.svg" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>

  <div class="mobile-box app-screen">

    <!-- Top Bar -->
    <div class="top-bar">
      <button type="button" class="hamburger-btn" aria-label="Open menu" onclick="toggleMenu()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
      </button>
      <span id="top-shop-name" class="top-shop-name"></span>
      <div class="top-right-icons">
        <a href="profile.html" id="profile-btn" class="profile-circle" aria-label="Profile"></a>
      </div>
    </div>

    <!-- Main Area -->
    <div class="main-area">
      <h2>Inventory</h2>

      <input
        type="text"
        id="inventory-search"
        class="search-bar"
        placeholder="Search"
        oninput="filterInventory()"
      />

      <div class="filter-bar">
        <button type="button" class="filter-btn active" onclick="setInventoryFilter('all', this)">All</button>
        <button type="button" class="filter-btn" onclick="setInventoryFilter('instock', this)">In Stock</button>
        <button type="button" class="filter-btn" onclick="setInventoryFilter('nearexpire', this)">Near Expire</button>
        <button type="button" class="filter-btn" onclick="setInventoryFilter('lowstock', this)">Low Stock</button>
        <button type="button" class="filter-btn" onclick="setInventoryFilter('outofstock', this)">Out of Stock</button>
      </div>

      <p id="inventory-msg" class="success-msg"></p>

      <div id="inventory-list" class="item-list">
        <p class="empty-text">Loading</p>
      </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-nav">
      <a href="home.html" class="nav-item">
        <span class="nav-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        </span>
        <span>Home</span>
      </a>
      <a href="inventory.html" class="nav-item active">
        <span class="nav-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"/><path d="M12 22V12"/><path d="m3.3 7 7.703 4.734a2 2 0 0 0 1.994 0L20.7 7"/></svg>
        </span>
        <span>Inventory</span>
      </a>
      <a href="add.html" class="nav-item">
        <span class="nav-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
        </span>
        <span>Add</span>
      </a>
      <a href="history.html" class="nav-item">
        <span class="nav-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        </span>
        <span>History</span>
      </a>
      <a href="profile.html" class="nav-item">
        <span class="nav-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </span>
        <span>Profile</span>
      </a>
    </div>

    <!-- Sold Popup -->
    <div id="sold-popup" class="popup-overlay" onclick="closeSoldPopup()">
      <div class="popup-box" onclick="event.stopPropagation()">
        <h3>Mark Sold</h3>
        <p id="sold-popup-name" class="popup-subtitle"></p>
        <input type="hidden" id="sold-popup-id" />
        <div class="field">
          <label for="sold-popup-qty">Quantity Sold</label>
          <input type="number" id="sold-popup-qty" min="1" value="1" />
        </div>
        <button type="button" class="btn btn-blue" onclick="confirmSoldPopup()">Confirm Sold</button>
        <button type="button" class="btn btn-gray" onclick="closeSoldPopup()">Cancel</button>
      </div>
    </div>

    <!-- Edit Item Popup -->
    <div id="edit-popup" class="popup-overlay" onclick="closeEditBox()">
      <div class="popup-box" onclick="event.stopPropagation()">
        <h3>Edit Item</h3>
        <input type="hidden" id="edit-item-id" />

        <div class="field">
          <label for="edit-item-name">Item Name</label>
          <input type="text" id="edit-item-name" />
        </div>

        <div class="field">
          <label for="edit-item-qty">Quantity</label>
          <div class="qty-row">
            <button type="button" class="qty-btn" onclick="stepEditQty(-1)">-</button>
            <input type="number" id="edit-item-qty" min="0" />
            <button type="button" class="qty-btn" onclick="stepEditQty(1)">+</button>
          </div>
        </div>

        <div class="field">
          <label for="edit-item-expiry">Expiry Date</label>
          <input type="date" id="edit-item-expiry" />
        </div>

        <div class="field">
          <label for="edit-item-description">Description (optional)</label>
          <textarea id="edit-item-description" rows="2" placeholder="Enter product description"></textarea>
        </div>

        <div class="field">
          <label for="edit-item-image">Change Photo (optional)</label>
          <input type="file" id="edit-item-image" accept="image/*,.heic,.heif" onchange="previewEditImage(event)" />
          <button type="button" class="btn btn-gray" onclick="openCamera('edit')">Take Photo (Camera)</button>
          <div id="edit-camera-box" class="camera-box">
            <video id="edit-camera-video" class="camera-video" autoplay playsinline></video>
            <button type="button" class="btn btn-blue" onclick="capturePhoto('edit')">Capture Photo</button>
            <button type="button" class="btn btn-gray" onclick="closeCamera('edit')">Close Camera</button>
          </div>
          <img id="edit-item-preview" class="image-preview" alt="Preview" />
        </div>

        <button type="button" class="btn btn-blue" onclick="saveEditedItem()">Save Changes</button>
        <button type="button" class="btn btn-gray" onclick="markAllSoldFromEdit()">All Sold</button>
        <button type="button" class="btn btn-danger" onclick="deleteFromEdit()">Delete Item</button>
        <button type="button" class="btn btn-gray" onclick="closeEditBox()">Cancel</button>
      </div>
    </div>

    <!-- Hamburger Side Menu -->
    <div id="side-menu-overlay" class="menu-overlay" onclick="toggleMenu()">
      <div class="side-menu" onclick="event.stopPropagation()">
        <div>
          <div class="menu-header">
            <p class="menu-title">Menu</p>
            <button type="button" class="close-menu-btn" aria-label="Close menu" onclick="toggleMenu()">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
            </button>
          </div>
          <div class="menu-links">
            <a href="home.html" class="menu-link">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
              <span>Home</span>
            </a>
            <a href="inventory.html" class="menu-link">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"/><path d="M12 22V12"/><path d="m3.3 7 7.703 4.734a2 2 0 0 0 1.994 0L20.7 7"/></svg>
              <span>Inventory</span>
            </a>
            <a href="add.html" class="menu-link">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
              <span>Add Product</span>
            </a>
            <a href="history.html" class="menu-link">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
              <span>History</span>
            </a>
            <a href="profile.html" class="menu-link">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              <span>Profile Settings</span>
            </a>
          </div>
        </div>
        <button type="button" id="logout-btn" class="btn btn-gray" onclick="handleLogout()">Logout</button>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
