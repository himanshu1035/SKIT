<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#3b5998" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Add Product - SKIT Shop</title>
  <link rel="manifest" href="../manifest.json" />
  <link rel="apple-touch-icon" href="../icons/icon.svg" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>

  <div class="mobile-box app-screen">

    <!-- Top Bar -->
    <div class="top-bar">
      <button type="button" class="hamburger-btn" onclick="toggleMenu()">&#9776;</button>
      <span id="top-shop-name" class="top-shop-name"></span>
      <div class="top-right-icons">
        <a href="history.html" class="top-icon-btn" title="History">&#128339;</a>
        <a href="profile.html" id="profile-btn" class="profile-circle"></a>
      </div>
    </div>

    <!-- Main Area: Add Product Batch Form -->
    <div class="main-area">
      <h2>Add Product Batch</h2>
      <p id="add-main-error" class="main-error"></p>
      <p id="add-success" class="success-msg"></p>

      <form id="add-product-form" onsubmit="handleAddProduct(event)">
        <div class="field">
          <label for="item-name">Item Name</label>
          <input type="text" id="item-name" placeholder="Enter item name" />
          <div id="item-name-error" class="error"></div>
        </div>

        <div class="field">
          <label for="item-quantity">Quantity</label>
          <input type="number" id="item-quantity" min="1" placeholder="Enter quantity" />
          <div id="item-quantity-error" class="error"></div>
        </div>

        <div class="field">
          <label for="item-expiry">Expiry Date</label>
          <input type="date" id="item-expiry" />
          <div id="item-expiry-error" class="error"></div>
        </div>

        <div class="field">
          <label for="item-description">Description (optional)</label>
          <textarea id="item-description" rows="2" placeholder="Enter product description"></textarea>
        </div>

        <div class="field">
          <label for="item-image">Product Image (optional)</label>
          <input type="file" id="item-image" accept="image/*,.heic,.heif" onchange="previewProductImage(event)" />
          <button type="button" class="btn btn-gray" onclick="openCamera('add')">Take Photo (Camera)</button>
          <div id="add-camera-box" class="camera-box">
            <video id="add-camera-video" class="camera-video" autoplay playsinline></video>
            <button type="button" class="btn btn-blue" onclick="capturePhoto('add')">Capture Photo</button>
            <button type="button" class="btn btn-gray" onclick="closeCamera('add')">Close Camera</button>
          </div>
          <img id="item-preview" class="image-preview" alt="Product preview" />
        </div>

        <button type="submit" class="btn btn-blue">Add Product</button>
      </form>
    </div>

    <!-- Bottom Navigation Bar (Home, Inventory, Add, History, Profile) -->
    <div class="bottom-nav">
      <a href="home.html" class="nav-item">
        <span class="nav-icon">&#127968;</span>
        <span>Home</span>
      </a>
      <a href="inventory.html" class="nav-item">
        <span class="nav-icon">&#128230;</span>
        <span>Inventory</span>
      </a>
      <a href="add.html" class="nav-item active">
        <span class="nav-icon">+</span>
        <span>Add</span>
      </a>
      <a href="history.html" class="nav-item">
        <span class="nav-icon">&#128339;</span>
        <span>History</span>
      </a>
      <a href="profile.html" class="nav-item">
        <span class="nav-icon">&#128100;</span>
        <span>Profile</span>
      </a>
    </div>

    <!-- Hamburger Side Menu -->
    <div id="side-menu-overlay" class="menu-overlay" onclick="toggleMenu()">
      <div class="side-menu" onclick="event.stopPropagation()">
        <div>
          <button type="button" class="close-menu-btn" onclick="toggleMenu()">&times;</button>
          <p class="menu-title">Menu</p>
          <div class="menu-links">
            <a href="home.html" class="menu-link">&#127968; Home</a>
            <a href="inventory.html" class="menu-link">&#128230; Inventory</a>
            <a href="add.html" class="menu-link">&#10133; Add Product</a>
            <a href="history.html" class="menu-link">&#128339; History</a>
            <a href="profile.html" class="menu-link">&#128100; Profile Settings</a>
          </div>
        </div>
        <button type="button" id="logout-btn" class="btn btn-gray" onclick="handleLogout()">Logout</button>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
