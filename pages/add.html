<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#F6F8F7" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Add Product - SKIT</title>
  <link rel="manifest" href="../manifest.json" />
  <link rel="apple-touch-icon" href="../icons/icon.svg" />
  <link rel="stylesheet" href="../css/theme.css" />
</head>
<body>

  <div class="mobile-box app-screen">

    <!-- Top Bar -->
    <div class="top-bar">
      <button type="button" class="hamburger-btn" aria-label="Open menu" onclick="toggleMenu()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
      </button>
      <span id="top-shop-name" class="top-shop-name">SKIT</span>
      <div class="top-right-icons">
        <a href="profile.html" id="profile-btn" class="profile-circle" aria-label="Profile">S</a>
      </div>
    </div>

    <!-- Main Area -->
    <div class="main-area has-sticky-cta">
      <h2>Add Product Batch</h2>
      <p id="add-main-error" class="main-error"></p>
      <p id="add-success" class="success-msg"></p>

      <form id="add-product-form" onsubmit="handleAddProduct(event)">
        <div class="field">
          <label for="item-name">Item Name</label>
          <input type="text" id="item-name" placeholder="Enter item name" />
          <div id="item-name-error" class="error"></div>
        </div>

        <div class="field">
          <label for="item-quantity">Quantity</label>
          <div class="qty-row">
            <button type="button" class="qty-btn" onclick="stepAddQty(-1)">&minus;</button>
            <input type="number" id="item-quantity" min="1" value="1" placeholder="1" />
            <button type="button" class="qty-btn" onclick="stepAddQty(1)">+</button>
          </div>
          <div id="item-quantity-error" class="error"></div>
        </div>

        <div class="field">
          <label for="item-expiry">Expiry Date</label>
          <input type="date" id="item-expiry" />
          <div id="item-expiry-error" class="error"></div>
        </div>

        <div class="field">
          <label for="item-description">Description (optional)</label>
          <textarea id="item-description" rows="2" placeholder="Enter product description"></textarea>
        </div>

        <div class="field">
          <label for="item-image">Product Photo (optional)</label>
          <div class="upload-zone">
            <div class="upload-zone-icon">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
            </div>
            <p class="upload-zone-title">Add product photo</p>
            <p class="upload-zone-sub">Upload from gallery or capture with camera</p>
            <input type="file" id="item-image" class="sr-file-input" accept="image/*,.heic,.heif" onchange="previewProductImage(event)" />
            <div class="upload-tiles">
              <button type="button" class="upload-tile" onclick="document.getElementById('item-image').click()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>
                <span>Upload</span>
              </button>
              <button type="button" class="upload-tile" onclick="openCamera('add')">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
                <span>Take Photo</span>
              </button>
            </div>
            <div id="add-camera-box" class="camera-box">
              <video id="add-camera-video" class="camera-video" autoplay playsinline></video>
              <button type="button" class="btn btn-blue" onclick="capturePhoto('add')">Capture Photo</button>
              <button type="button" class="btn btn-gray" onclick="closeCamera('add')">Close Camera</button>
            </div>
            <img id="item-preview" class="image-preview" alt="Product preview" />
          </div>
        </div>
      </form>
    </div>

    <!-- Sticky Add Product CTA above Bottom Nav -->
    <div class="sticky-submit-bar">
      <button type="submit" form="add-product-form" class="btn btn-blue">Add Product</button>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-nav">
      <a href="home.html" class="nav-item">
        <span class="nav-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        </span>
        <span>Home</span>
      </a>
      <a href="inventory.html" class="nav-item">
        <span class="nav-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"/><path d="M12 22V12"/><path d="m3.3 7 7.703 4.734a2 2 0 0 0 1.994 0L20.7 7"/></svg>
        </span>
        <span>Inventory</span>
      </a>
      <a href="add.html" class="nav-item nav-add active" aria-label="Add Product">
        <span class="nav-add-circle">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
        </span>
        <span>Add</span>
      </a>
      <a href="history.html" class="nav-item">
        <span class="nav-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        </span>
        <span>History</span>
      </a>
      <a href="profile.html" class="nav-item">
        <span class="nav-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </span>
        <span>Profile</span>
      </a>
    </div>

    <!-- Side Drawer -->
    <div id="side-menu-overlay" class="menu-overlay" onclick="toggleMenu()">
      <div class="side-menu" onclick="event.stopPropagation()">
        <div>
          <div class="menu-header">
            <div class="menu-user">
              <div id="drawer-avatar" class="profile-circle">S</div>
              <div>
                <p id="drawer-shop-name" class="menu-shop-name">SKIT</p>
                <p class="menu-sub">Kirana Inventory</p>
              </div>
            </div>
            <button type="button" class="close-menu-btn" aria-label="Close menu" onclick="toggleMenu()">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
            </button>
          </div>
          <div class="menu-links">
            <a href="home.html" class="menu-link">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
              <span>Home</span>
            </a>
            <a href="inventory.html" class="menu-link">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"/><path d="M12 22V12"/><path d="m3.3 7 7.703 4.734a2 2 0 0 0 1.994 0L20.7 7"/></svg>
              <span>Inventory</span>
            </a>
            <a href="add.html" class="menu-link active">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
              <span>Add Product</span>
            </a>
            <a href="history.html" class="menu-link">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
              <span>History</span>
            </a>
            <a href="profile.html" class="menu-link">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              <span>Profile Settings</span>
            </a>
          </div>
        </div>
        <button type="button" id="logout-btn" class="btn btn-danger" onclick="handleLogout()">Logout</button>
      </div>
    </div>

  </div>

  <script src="../js/supabase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
