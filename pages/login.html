<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#3b5998" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Login - SKIT Shop</title>
  <link rel="manifest" href="../manifest.json" />
  <link rel="apple-touch-icon" href="../icons/icon.svg" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>

  <div class="mobile-box">
    <a href="../index.html" class="back-link">&larr; Back</a>

    <h2>Login</h2>
    <p id="login-main-error" class="main-error"></p>

    <form id="login-form" onsubmit="handleLogin(event)">
      <div class="field">
        <label for="login-mobile">Mobile Number</label>
        <input type="tel" id="login-mobile" placeholder="10-digit mobile number" maxlength="10" />
        <div id="login-mobile-error" class="error"></div>
      </div>

      <div class="field">
        <label for="login-password">Password</label>
        <div class="password-box">
          <input type="password" id="login-password" placeholder="Enter password" />
          <button type="button" class="show-btn" onclick="togglePassword('login-password', this)">
            Show
          </button>
        </div>
        <div id="login-password-error" class="error"></div>
      </div>

      <button type="submit" class="btn btn-blue">Login</button>
    </form>

    <p class="bottom-text">
      New user? <a href="signup.html">Sign Up</a>
    </p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/app.js"></script>
</body>
</html>
