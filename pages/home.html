<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#3b5998" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Home - SKIT Shop</title>
  <link rel="manifest" href="../manifest.json" />
  <link rel="apple-touch-icon" href="../icons/icon.svg" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>

  <div class="mobile-box app-screen">

    <!-- Top Bar -->
    <div class="top-bar">
      <button type="button" class="hamburger-btn" onclick="toggleMenu()">&#9776;</button>
      <span id="top-shop-name" class="top-shop-name"></span>
      <div class="top-right-icons">
        <a href="history.html" class="top-icon-btn" title="History">&#128339;</a>
        <a href="profile.html" id="profile-btn" class="profile-circle"></a>
      </div>
    </div>

    <!-- Main Dashboard Area with 2 Stat Boxes & All Items -->
    <div class="main-area">
      <div class="box-grid">
        <div class="stat-box">
          <div id="home-total-items" class="stat-number">0</div>
          <div class="stat-label">Total Items</div>
        </div>
        <div class="stat-box">
          <div id="home-near-expire" class="stat-number">0</div>
          <div class="stat-label">Near Expire (7d)</div>
        </div>
      </div>

      <p class="home-section-title">All Items</p>
      <input
        type="text"
        id="home-search"
        class="search-bar"
        placeholder="Search items..."
        oninput="filterHomeItems()"
      />
      <div class="filter-bar">
        <button type="button" class="filter-btn active" onclick="setHomeFilter('all', this)">All</button>
        <button type="button" class="filter-btn" onclick="setHomeFilter('instock', this)">In Stock</button>
        <button type="button" class="filter-btn" onclick="setHomeFilter('nearexpire', this)">Near Expire</button>
        <button type="button" class="filter-btn" onclick="setHomeFilter('lowstock', this)">Low Stock</button>
        <button type="button" class="filter-btn" onclick="setHomeFilter('outofstock', this)">Out of Stock</button>
      </div>
      <div id="home-items-list" class="item-list">
        <p class="empty-text">Loading...</p>
      </div>
    </div>

    <!-- Bottom Navigation Bar (Home, Inventory, Add, History, Profile) -->
    <div class="bottom-nav">
      <a href="home.html" class="nav-item active">
        <span class="nav-icon">&#127968;</span>
        <span>Home</span>
      </a>
      <a href="inventory.html" class="nav-item">
        <span class="nav-icon">&#128230;</span>
        <span>Inventory</span>
      </a>
      <a href="add.html" class="nav-item">
        <span class="nav-icon">+</span>
        <span>Add</span>
      </a>
      <a href="history.html" class="nav-item">
        <span class="nav-icon">&#128339;</span>
        <span>History</span>
      </a>
      <a href="profile.html" class="nav-item">
        <span class="nav-icon">&#128100;</span>
        <span>Profile</span>
      </a>
    </div>

    <!-- Hamburger Side Menu -->
    <div id="side-menu-overlay" class="menu-overlay" onclick="toggleMenu()">
      <div class="side-menu" onclick="event.stopPropagation()">
        <div>
          <button type="button" class="close-menu-btn" onclick="toggleMenu()">&times;</button>
          <p class="menu-title">Menu</p>
          <div class="menu-links">
            <a href="home.html" class="menu-link">&#127968; Home</a>
            <a href="inventory.html" class="menu-link">&#128230; Inventory</a>
            <a href="add.html" class="menu-link">&#10133; Add Product</a>
            <a href="history.html" class="menu-link">&#128339; History</a>
            <a href="profile.html" class="menu-link">&#128100; Profile Settings</a>
          </div>
        </div>
        <button type="button" id="logout-btn" class="btn btn-gray" onclick="handleLogout()">Logout</button>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/app.js"></script>
</body>
</html>
