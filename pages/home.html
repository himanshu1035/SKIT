<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#fafafa" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Home - SKIT Shop</title>
  <link rel="manifest" href="../manifest.json" />
  <link rel="apple-touch-icon" href="../icons/icon.svg" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>

  <div class="mobile-box app-screen">

    <!-- Top Bar -->
    <div class="top-bar">
      <button type="button" class="hamburger-btn" aria-label="Open menu" onclick="toggleMenu()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
      </button>
      <span id="top-shop-name" class="top-shop-name"></span>
      <div class="top-right-icons">
        <a href="profile.html" id="profile-btn" class="profile-circle" aria-label="Profile"></a>
      </div>
    </div>

    <!-- Main Dashboard Area -->
    <div class="main-area">
      <div class="box-grid">
        <div class="stat-box">
          <div id="home-total-items" class="stat-number"><span class="skeleton skeleton-stat" aria-hidden="true"></span></div>
          <div class="stat-label">Total Items</div>
        </div>
        <div class="stat-box">
          <div id="home-near-expire" class="stat-number"><span class="skeleton skeleton-stat" aria-hidden="true"></span></div>
          <div class="stat-label">Near Expire (7d)</div>
        </div>
      </div>

      <p class="home-section-title">All Items</p>
      <input
        type="text"
        id="home-search"
        class="search-bar"
        placeholder="Search"
        oninput="filterHomeItems()"
      />
      <div class="filter-bar">
        <button type="button" class="filter-btn active" onclick="setHomeFilter('all', this)">All</button>
        <button type="button" class="filter-btn" onclick="setHomeFilter('instock', this)">In Stock</button>
        <button type="button" class="filter-btn" onclick="setHomeFilter('nearexpire', this)">Near Expire</button>
        <button type="button" class="filter-btn" onclick="setHomeFilter('lowstock', this)">Low Stock</button>
        <button type="button" class="filter-btn" onclick="setHomeFilter('outofstock', this)">Out of Stock</button>
      </div>
      <div id="home-items-list" class="item-list">
        <div class="item-card" aria-hidden="true">
          <div class="skeleton skeleton-thumb"></div>
          <div class="skeleton-lines">
            <div class="skeleton skeleton-line w-60"></div>
            <div class="skeleton skeleton-line w-30"></div>
            <div class="skeleton skeleton-line w-40"></div>
          </div>
        </div>
        <div class="item-card" aria-hidden="true">
          <div class="skeleton skeleton-thumb"></div>
          <div class="skeleton-lines">
            <div class="skeleton skeleton-line w-60"></div>
            <div class="skeleton skeleton-line w-30"></div>
            <div class="skeleton skeleton-line w-40"></div>
          </div>
        </div>
        <div class="item-card" aria-hidden="true">
          <div class="skeleton skeleton-thumb"></div>
          <div class="skeleton-lines">
            <div class="skeleton skeleton-line w-60"></div>
            <div class="skeleton skeleton-line w-30"></div>
            <div class="skeleton skeleton-line w-40"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-nav">
      <a href="home.html" class="nav-item active">
        <span class="nav-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        </span>
        <span>Home</span>
      </a>
      <a href="inventory.html" class="nav-item">
        <span class="nav-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"/><path d="M12 22V12"/><path d="m3.3 7 7.703 4.734a2 2 0 0 0 1.994 0L20.7 7"/></svg>
        </span>
        <span>Inventory</span>
      </a>
      <a href="add.html" class="nav-item">
        <span class="nav-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
        </span>
        <span>Add</span>
      </a>
      <a href="history.html" class="nav-item">
        <span class="nav-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        </span>
        <span>History</span>
      </a>
      <a href="profile.html" class="nav-item">
        <span class="nav-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </span>
        <span>Profile</span>
      </a>
    </div>

    <!-- Hamburger Slide Menu -->
    <div id="side-menu-overlay" class="menu-overlay" onclick="toggleMenu()">
      <div class="side-menu" onclick="event.stopPropagation()">
        <div>
          <div class="menu-header">
            <p class="menu-title">Menu</p>
            <button type="button" class="close-menu-btn" aria-label="Close menu" onclick="toggleMenu()">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
            </button>
          </div>
          <div class="menu-links">
            <a href="home.html" class="menu-link">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
              <span>Home</span>
            </a>
            <a href="inventory.html" class="menu-link">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"/><path d="M12 22V12"/><path d="m3.3 7 7.703 4.734a2 2 0 0 0 1.994 0L20.7 7"/></svg>
              <span>Inventory</span>
            </a>
            <a href="add.html" class="menu-link">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
              <span>Add Product</span>
            </a>
            <a href="history.html" class="menu-link">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
              <span>History</span>
            </a>
            <a href="profile.html" class="menu-link">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              <span>Profile Settings</span>
            </a>
          </div>
        </div>
        <button type="button" id="logout-btn" class="btn btn-gray" onclick="handleLogout()">Logout</button>
      </div>
    </div>

  </div>

  <script src="../js/supabase.min.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
